<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ranma site at phone width, light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Shippori+Mincho:wght@600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; overflow: hidden; background: #f3eee3">
<dc-import name="Main" theme="light" show-capture="{{ showCapture }}" hint-size="390px,14500px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showCapture":{"editor":"boolean","default":false},"$preview":{"width":390,"height":14500}}'>
class Component extends DCLogic {
  renderVals() {
    return { showCapture: this.props.showCapture ?? false };
  }
}
</script>
</body>
</html>
