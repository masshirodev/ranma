# The pre-commit gate of AGENTS.md on every push to main and every pull
# request: a contributor's change gets the same checks the hooks run here.
# doc/TESTING.md says what each one covers.
name: ci

on:
  push:
    branches: [main, macos]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # The smoke test drives the release build in a private headless tmux.
      - name: Smoke
        run: |
          sudo apt-get install -y -qq tmux
          scripts/smoke.sh
      # The latest release against this build: its config, a handover both
      # ways, its client on this server and back (scripts/compat.sh).
      - name: Against the last release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/compat.sh

  # macOS (ROADMAP 15): the src/os half there, and everything else, built
  # and tested on both architectures.
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # macOS's own bash is 3.2, and the smoke is written for a current one.
      - name: Smoke
        run: |
          brew install tmux bash
          "$(brew --prefix)/bin/bash" scripts/smoke.sh
