# The built-in theme. Every other theme inherits from this one unless it says
# `inherits = "<name>"`, so a user theme only needs the keys it changes.
#
# Colours are "#rrggbb", an ANSI name ("blue", "bright-black", ...), an index
# 0-255, or "default" for the host terminal's own foreground/background.

[colors]
border_active = "#89b4fa"
border_inactive = "#45475a"
border_floating = "#f5c2e7"
bar_bg = "default"
bar_fg = "#cdd6f4"
bar_dim = "#6c7086"
bar_accent = "#89b4fa"
mode_fg = "#1e1e2e"
mode_bg = "#f38ba8"
# Bar module styles: a module that returns { text = ..., style = "urgent" }
# is drawn in bar_urgent; "dim" and "accent" use the keys above.
bar_urgent = "#f38ba8"
# The workspaces module.
ws_active_fg = "#1e1e2e"
ws_active_bg = "#89b4fa"
ws_occupied = "#cdd6f4"
ws_empty = "#6c7086"
ws_urgent = "#f38ba8"
# The session switcher, pane switcher and help: the selected row.
picker_selected_fg = "#1e1e2e"
picker_selected_bg = "#89b4fa"
# Search matches in copy mode: every visible match, and the current one.
search_fg = "#1e1e2e"
search_bg = "#f9e2af"
search_current_fg = "#1e1e2e"
search_current_bg = "#fab387"
# Toasts (ranma notify, ranma.toast, bells in hidden panes). Their border is
# bar_accent, or bar_urgent for urgent ones.
toast_fg = "#cdd6f4"
toast_bg = "#313244"
# Tab bars of grouped (tabbed) containers.
tab_active_fg = "#1e1e2e"
tab_active_bg = "#89b4fa"
tab_inactive_fg = "#cdd6f4"
tab_inactive_bg = "#313244"
# Toolbars (ranma.toolbar). Unset here on purpose: each follows the role after
# it, so a theme that sets only those roles styles toolbars too.
# toolbar_bg = bar_bg                   the gaps and the rest of the row
# button_fg / button_bg = tab_inactive_fg / tab_inactive_bg
# button_pressed_fg / _bg = button_bg / button_fg    (reversed)
# button_active_fg / _bg = tab_active_fg / tab_active_bg
# button_latched_fg / _bg = mode_fg / mode_bg
# button_disabled_fg = bar_dim

# Copy mode's selection, and a bar module's ground (see [bar]). Unset here on
# purpose: the selection is drawn reversed, and modules sit on bar_bg.
# selection_fg = ...    selection_bg = ...
# module_fg = ...       module_bg = ...

[border]
# rounded | plain | thick | double | ascii | custom | none
style = "rounded"
# Floats and popups; unset, the same as style.
# floating_style = "double"
# With style = "custom": top-left, top-right, bottom-left, bottom-right,
# horizontal, vertical.
# chars = "╭╮╰╯─│"
# Where a pane's title goes on its border: top | bottom | off.
title = "top"
# left | center | right
title_align = "left"
# {title} (its name, else what its program set), {index} (its place in the
# workspace, from 1), {program} (the program in its foreground), {cwd} (its
# directory, ~ for home). A part in [ ] shows only when every placeholder in
# it has a value: " {index}[ {program}] ". [[ ]] {{ }} are the characters.
title_format = " {title} "
# none | arrows: arrows on the focused pane's edges, pointing in.
indicator = "none"

[gaps]
# Measured in cells. A terminal cell is roughly twice as tall as it is wide,
# so outer gaps usually look best at horizontal = 2 * vertical.
inner = 0
outer_horizontal = 0
outer_vertical = 0

[bar]
# top | bottom | hidden
position = "bottom"
# Drawn between two modules on the same side.
separator = "  "
# A workspace in the workspaces module, and the current one: {n} is its
# number, {name} its name (or its program's). [:{name}] shows only with one.
workspace_format = " {n}[:{name}] "
workspace_current_format = " {n}[:{name}] "
# Drawn before and after each module, in colors.module_bg on bar_bg: with
# powerline glyphs ("\ue0b6" and "\ue0b4", say) and a module_bg, every module
# is a pill. Empty: nothing.
module_left = ""
module_right = ""

[panes]
# Fade the text of unfocused panes toward their background: 0 is off, 0.3 is
# a gentle hint of where focus is, 1 hides them. Uses the colours your
# terminal reports; one that reports none gets its faint attribute instead.
dim_unfocused = 0.0
# The ground of the focused pane and of the others, where the program leaves
# the default background (tmux's window-active-style and window-style).
# Unset: the terminal's own.
# active_bg = "#1e1e2e"
# inactive_bg = "#181825"

[styles]
# Text attributes per role: bold, dim, italic, underline, reverse,
# strikethrough. Colours are in [colors].
bar = []
dim = []
accent = []
urgent = ["bold"]
mode = ["bold"]
ws_active = ["bold"]
ws_occupied = []
ws_empty = []
ws_urgent = ["bold"]
tab_active = ["bold"]
tab_inactive = []
# A pane's title on its border, and the focused pane's.
title = []
title_active = []
picker_selected = []
toast = []
